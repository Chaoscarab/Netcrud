services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netcrud-app
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=netcrud;Username=netcrud;Password=netcrudpass
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: netcrud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: netcrud
      POSTGRES_USER: netcrud
      POSTGRES_PASSWORD: netcrudpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netcrud -d netcrud"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: